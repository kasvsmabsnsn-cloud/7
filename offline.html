<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لا يوجد اتصال بالإنترنت - نموذج مسلم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #151B2B;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="w-20 h-20 bg-red-500/10 text-red-400 rounded-3xl flex items-center justify-center mx-auto mb-6 border border-red-500/20">
            <i data-lucide="wifi-off" class="w-10 h-10"></i>
        </div>
        <h1 class="text-2xl font-black text-white mb-3">لا يوجد اتصال بالإنترنت</h1>
        <p class="text-slate-400 text-sm leading-relaxed mb-8">
            يبدو أنك غير متصل بالشبكة حالياً. يرجى التحقق من اتصال الإنترنت لديك ثم محاولة إعادة المحاولة للوصول إلى قاعدة الفتاوى.
        </p>
        <button onclick="window.location.reload()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-2xl transition-all shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2">
            <i data-lucide="rotate-cw" class="w-4 h-4"></i> إعادة المحاولة
        </button>
    </div>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
