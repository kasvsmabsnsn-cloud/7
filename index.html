    <!-- ===== صفحة التحميل (Splash Screen) ===== -->

    <!-- مودال الإبلاغ عن مشكلة -->
    <div id="reportModal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">

            <textarea id="reportText" rows="5" placeholder="يرجى وصف المشكلة بالتفصيل..." class="w-full bg-black/30 border border-white/10 rounded-2xl p-4 text-white placeholder-white/50 resize-none"></textarea>
            <div class="flex gap-3 mt-6">
                <button onclick="submitReport()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-2xl transition-all">إرسال</button>
                <button onclick="closeReportModal()" class="flex-1 bg-white/10 hover:bg-white/20 text-white font-bold py-3 rounded-2xl transition-all">إلغاء</button>

    <!-- مودال التقييم الحقيقي -->
    <div id="ratingModal" class="modal-overlay">
        <div class="modal-content text-center">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-black text-white">تقييم الفتوى</h2>

    <script>
        // ==================== تعريف الدوال العامة ====================
        window.openReportModal = function(question = null) {
            const modal = document.getElementById('reportModal');
            const textarea = document.getElementById('reportText');
            if (modal && textarea) {
                textarea.value = question ? `السؤال: ${question}\n\nالمشكلة: ` : '';
                modal.classList.add('active');
            }
        };

        window.closeReportModal = function() {
            const modal = document.getElementById('reportModal');
            if (modal) {
                modal.classList.remove('active');
                document.getElementById('reportText').value = '';
            }
        };

        window.submitReport = async function() {
            const problem = document.getElementById('reportText').value;
            if (!problem.trim()) {
                showNotification("يرجى كتابة المشكلة", "error");
                return;
            }
            await sendReportNotification(problem);
            showNotification("تم إرسال البلاغ بنجاح، شكراً لك!");
            closeReportModal();
        };

        // إخفاء شاشة التحميل (Splash Screen) الناعمة
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.classList.add('hidden');
            }
        }, 1500);

        // ==================== Firebase Configuration ====================
        const firebaseConfig = {
            apiKey: "AIzaSyC4n627jxgPjoQn7icO9OP9C3ImcAbLEME",
            authDomain: "private-d338e.firebaseapp.com",
            databaseURL: "https://private-d338e-default-rtdb.firebaseio.com",
            projectId: "private-d338e",
            storageBucket: "private-d338e.firebasestorage.app",
            messagingSenderId: "514393440915",
            appId: "1:514393440915:web:b72e886e866f45ab948366",
            measurementId: "G-Z8RT3VY8SL"
        };
        
        if (!firebase.apps || !firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // ==================== Telegram Bot Configuration ====================
        const TELEGRAM_BOT_TOKEN = "8001439036:AAFAVndQ0GlWuz0djflhyPYo5Jo17oMLAHo";
        const TELEGRAM_CHAT_ID = "6068331455";

        // ==================== مفاتيح Gemini المحملة ديناميكياً من Firebase ====================
        let dynamicApiKeys = [];
        let currentKeyIndex = 0;

        function loadApiKeysFromFirebase() {
            db.ref('api_keys').on('value', (snapshot) => {
                dynamicApiKeys = [];
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const keyData = childSnapshot.val();
                        if (keyData && keyData.enabled === true && keyData.key) {
                            dynamicApiKeys.push({
                                firebaseId: childSnapshot.key,
                                key: keyData.key,
                                requestsCount: keyData.requestsCount || 0
                            });
                        }
                    });
                }
                if (currentKeyIndex >= dynamicApiKeys.length) {
                    currentKeyIndex = 0;
                }
            });
        }
        loadApiKeysFromFirebase();

        // رسائل التحميل المتغيرة داخل الشات
        let loadingMessageInterval = null;
        const loadingMessagesList = [
            "📚 جاري استرجاع الفتاوى ...",
            "🧠 جاري تحليل السؤال...",
            "📖 جاري مراجعة الأدلة ...",
            "✍️ جاري صياغة الفتوى...",
            "جاري التحقق من الصحة ✅️" 
        ];
        let currentMsgIndex = 0;

        function startDynamicLoadingMessages() {
            const loadingTextEl = document.getElementById('dynamic-loading-text');
            if (!loadingTextEl) return;
            currentMsgIndex = 0;
            loadingTextEl.textContent = loadingMessagesList[currentMsgIndex];
            loadingTextEl.classList.remove('fade-out');
            if (loadingMessageInterval) clearInterval(loadingMessageInterval);
            loadingMessageInterval = setInterval(() => {
                loadingTextEl.classList.add('fade-out');
                setTimeout(() => {
                    currentMsgIndex = (currentMsgIndex + 1) % loadingMessagesList.length;
                    loadingTextEl.textContent = loadingMessagesList[currentMsgIndex];
                    loadingTextEl.classList.remove('fade-out');
                }, 300);
            }, 1800);
        }

        function stopDynamicLoadingMessages() {
            if (loadingMessageInterval) {
                clearInterval(loadingMessageInterval);
                loadingMessageInterval = null;
            }
        }

        // ==================== SYSTEM_STRICT_INSTRUCTION ====================
        const SYSTEM_STRICT_INSTRUCTION = `
[تنبيه واستثناء هام جداً]:
إذا كان سؤال المستخدم ليس استفساراً فقهياً أو شرعياً (مثل: عمليات حسابية بسيطة، أسئلة برمجية، تحيات، أو أسئلة عامة):
- أجب فقط بشكل مباشر، محدد، ومختصر جداً في سطر أو سطرين.
- لا تطبق هيكل الفتوى الشرعية.

[في حال كان السؤال استفساراً فقهياً أو شرعياً حقيقياً، التزم حصراً بالهيكل التالي]:
أنت عالم ومفتي إسلامي راسخ تتبع المنهج السلفي. يجب عليك صياغة الإجابة بدقة بالغة وبناءً على الهيكل الصارم التالي حصراً، مع استخدام عناوين رئيسية واضحة وبخط عريض ونقاط تفصيلية تحته:

[عنوان المسألة بخط عريض كبير]

■ أولاً: الأدلة من الكتاب والسنة:
- ذكر الآيات القرآنية الكريمة المتعلقة بالمسألة بدقة.
- ذكر الأحاديث النبوية الصحيحة من كتب السنة.

■ ثانياً: أقوال الصحابة رضي الله عنهم:
- سرد الآثار الواردة عن الصحابة في هذا الباب.

■ ثالثاً: مجمل أقوال العلماء:
- بيان مجمل آراء العلماء في المسألة.

■ رابعاً: أدلة كل قول:
- ذكر أدلة كل فريق ومستند كل قول بالتفصيل.

■ خامساً: تحقيقات شيخ الإسلام ابن تيمية:
- ذكر ما يخص المسألة من تحقيقات ونقولات عن شيخ الإسلام ابن تيمية رحمه الله.

■ سادساً: فصل الترجيح وسبب الترجيح:
- بيان القول الراجح في المسألة مع ذكر سبب الترجيح وقوة الدليل.

■ سابعاً: فصل الرد على الشبهات:
- الرد العلمي على الشبهات أو الأقوال المرجوحة المخالفة للحق.

■ ثامناً: مستويات الشرح والتفصيل:
1. الشرح المفصل (تفكيك المسألة فقهياً).
2. الشرح المختصر (إيجاز غير مخل).

■ تاسعاً: خلاصة الحكم الشرعي النهائي:
- النتيجة الفقهية المستخلصة بوضوح.

■ عاشراً: التحذيرات والتوجيهات:
- التحذير الصارم من المشابهة أو الخلط أو اللبس في هذه المسألة، وبيان الأوجه الفاسدة للقياس أو الممارسات الخاطئة المرتبطة بها.

وفي ختام الإجابة تماماً، يجب أن تكتب في سطر مستقل وبشكل واضح: "والله تعالى أعلم".
`;

        // ==================== App State ====================
        let state = {
            messages: [],
            input: "",
            loading: false,
            isMenuOpen: false,
            isHeroProminent: true,
            typingResponse: "",
            isListening: false,
            autoScrollEnabled: true
        };

        let typeInterval = null;
        let cachedFatwasMemory = []; // ذاكرة محلية لتخزين الفتاوى

        // ==================== Helper Functions ====================
        function safeMarkdownParse(text) {
            if (!text) return "";
            try {
                if (typeof marked !== 'undefined' && marked.parse) {
                    return marked.parse(text);
                }
                return text;
            } catch (error) {
                return text;
            }
        }

        function formatAIContent(text) {
            return `<div class="prose dark:prose-invert max-w-none shadow-sm">${safeMarkdownParse(text || "")}</div>`;
        }

        function copyToClipboard(text) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                showNotification("✅ تم نسخ الإجابة بنجاح!");
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showNotification("✅ تم نسخ الإجابة بنجاح!");
            });
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `fixed bottom-24 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-white font-bold z-50 animate-in fade-in slide-in-from-bottom-5 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== Scroll Management ====================
        let isUserScrolling = false;
        let scrollTimeout;

        function setupScrollHandling() {
            const messagesContainer = document.querySelector('.messages-container');
            if (!messagesContainer) return;
            messagesContainer.addEventListener('scroll', () => {
                isUserScrolling = true;
                state.autoScrollEnabled = false;
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    isUserScrolling = false;
                    const isNearBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 100;
                    if (isNearBottom) state.autoScrollEnabled = true;
                }, 150);
            });
        }

        function scrollToBottom(force = false) {
            if (!state.autoScrollEnabled && !force) return;
            const messagesContainer = document.querySelector('.messages-container');
            if (messagesContainer) {
                messagesContainer.scrollTo({ top: messagesContainer.scrollHeight, behavior: 'smooth' });
            }
        }

        // ==================== Telegram Notifications ====================
        async function sendTelegramNotification(message) {
            try {
                const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
                await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'HTML' })
                });
            } catch (error) {
                console.error("Telegram error:", error);
            }
        }

        async function notifyNewQuestion(question, fatwaId) {
            const timestamp = new Date().toLocaleTimeString('ar-EG');
            const message = `🔔 <b>سؤال جديد:</b>\n${question.substring(0, 200)}\n🆔 <b>الرقم:</b> <code>${fatwaId}</code>\n⏰ <b>الوقت:</b> ${timestamp}`;
            await sendTelegramNotification(message);
        }

        async function sendReportNotification(problem) {
            const message = `⚠️ <b>بلاغ جديد:</b>\n${problem}`;
            await sendTelegramNotification(message);
        }

        // ==================== Typewriter Effect ====================
        function startTypewriter(fullText, messageId) {
            if (typeInterval) clearInterval(typeInterval);
            state.typingResponse = "";
            let idx = 0;
            const speed = 4;

            typeInterval = setInterval(() => {
                if (idx <= fullText.length) {
                    state.typingResponse = fullText.slice(0, idx);
                    const msgDiv = document.querySelector(`.ai-card[data-message-id="${messageId}"]`);
                    if (msgDiv) {
                        const contentDiv = msgDiv.querySelector('.text-lg');
                        if (contentDiv) contentDiv.innerHTML = formatAIContent(state.typingResponse);
                    }
                    const mObj = state.messages.find(m => m.id === messageId);
                    if (mObj) mObj.text = state.typingResponse;
                    scrollToBottom();
                    idx += 3;
                } else {
                    clearInterval(typeInterval);
                    typeInterval = null;
                    state.typingResponse = fullText;
                    const mObj = state.messages.find(m => m.id === messageId);
                    if (mObj) {
                        mObj.text = fullText;
                        mObj.isTyping = false;
                        saveMessagesToLocal();
                    }
                    renderMessages();
                }
            }, speed);
        }

        // ==================== Save/Load History ====================
        function saveMessagesToLocal() {
            if (state.messages.length > 0) {
                localStorage.setItem('selfie_ai_history', JSON.stringify(state.messages));
            }
        }

        function loadMessagesFromLocal() {
            const saved = localStorage.getItem('selfie_ai_history');
            if (saved) {
                try {
                    state.messages = JSON.parse(saved);
                    if (state.messages.length > 0) state.isHeroProminent = false;
                    renderMessages();
                } catch (e) {
                    localStorage.removeItem('selfie_ai_history');
                }
            }
        }

        function clearHistory() {
            if (window.confirm("هل تريد مسح سجل المحادثات؟")) {
                localStorage.removeItem('selfie_ai_history');
                state.messages = [];
                state.isHeroProminent = true;
                renderMessages();
                renderHero();
            }
        }

        function renderHero() {
            const heroDiv = document.getElementById('hero-container');
            if (heroDiv) {
                heroDiv.style.display = (state.isHeroProminent && state.messages.length === 0) ? 'flex' : 'none';
            }

        // ==================== Render Elements ====================
        function createUserMessageElement(text, messageId) {
            const maxLength = 150;

                    <div class="flex items-center gap-3">

                            <i data-lucide="user" class="w-5 h-5"></i>
                        </div>
                        <span class="text-[#3B82F6] font-[900] text-xl tracking-widest">سؤالك:</span>
                    </div>
                    <div class="pr-12 relative">
                        <h2 class="text-2xl font-black leading-tight text-white">${escapeHtml(displayText)}${isLong ? '...' : ''}</h2>
                    </div>
                </div>
            `;
        }

        function createAIMessageElement(text, verified, isTyping, messageId) {

                    <div class="absolute -top-6 left-6 right-6 flex items-center justify-between z-20">
                        <div class="flex flex-col items-start gap-1">
                            <span class="status-text-glow text-[11px] px-2 py-0.5 rounded-md ${verified ? 'text-green-500' : 'text-yellow-500'}">
                                ${verified ? "✓ إجابة معتمدة" : "⌛ إجابة ذكية سريعة"}
                            </span>
                            <div class="flex items-center gap-2 mr-1">
                                <div class="status-circle bg-blue-500"><i data-lucide="cpu" class="w-3 h-3 text-white"></i></div>
                                <div class="status-circle circle-verified"><i data-lucide="check" class="w-4 h-4 text-white font-bold"></i></div>
                            </div>
                        </div>
                        <button onclick="window.copyMessage('${messageId}')" class="bg-[#3B82F6] hover:bg-blue-700 text-white px-5 py-2.5 rounded-full text-sm font-black shadow-[0_0_15px_rgba(59,130,246,0.5)] flex items-center gap-2 transition-all">

                    </div>
                    <div class="mt-6 pt-4 border-t border-white/10 flex items-center justify-center gap-2">
                        <button onclick="window.speakFatwaText('${messageId}')" class="flex flex-col items-center justify-center p-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 transition-all w-20">

        function renderMessages() {
            const container = document.getElementById('messages-container');
            if (!container) return;
            if (state.messages.length === 0) {
                container.innerHTML = '';
                return;
            }
            let html = '<div class="w-full">';
            state.messages.forEach((msg, idx) => {
                const mId = msg.id || `msg_${idx}`;
                if (msg.role === 'user') {
                    html += createUserMessageElement(msg.text, mId);
                } else {
                    html += createAIMessageElement(msg.text, msg.verified || true, msg.isTyping || false, mId);
                }
            });

            if (state.loading) {
                html += `
                    <div class="w-full flex items-center justify-start my-6 px-4 pr-6">
                        <div class="flex items-center gap-3 text-blue-400 font-bold text-xl" style="text-shadow: 0 2px 10px rgba(148, 163, 184, 0.25);">
                            <i data-lucide="refresh-cw" class="w-8 h-8 animate-spin shrink-0"></i> 
                            <span id="dynamic-loading-text" class="loading-fade text-white inline-block">جاري استنباط الرد من المراجع...</span>
                        </div>
                    </div>
                `;
                setTimeout(startDynamicLoadingMessages, 50);
            } else {
                stopDynamicLoadingMessages();
            }

            html += '<div id="messages-end"></div></div>';
            container.innerHTML = html;
            if (window.lucide) lucide.createIcons();
            scrollToBottom(true);
        }

        window.copyMessage = function(mId) {
            const m = state.messages.find(x => x.id === mId);
            if (m) copyToClipboard(m.text);
        };

        window.speakFatwaText = function(mId) {
            const m = state.messages.find(x => x.id === mId);
            if (!m) return;
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance(m.text);
                u.lang = 'ar-SA';
                window.speechSynthesis.speak(u);
                showNotification("🔊 جاري النطق...");
            } else {
                showNotification("المتصفح لا يدعم النطق", "error");
            }
        };

        window.shareFatwaWithRequiredText = function(mId) {
            const m = state.messages.find(x => x.id === mId);
            if (!m) return;
            const fullText = `تم الرد على هذه الفتوى بواسطة نموذج مسلم\nرابط الموقع:\nhttps://thekillersalafi.web.app\n\n${m.text}`;
            if (navigator.share) {
                navigator.share({ title: 'فتوى شرعية', text: fullText, url: 'https://thekillersalafi.web.app' }).catch(()=>{});
            } else {
                copyToClipboard(fullText);
                showNotification("تم النسخ للمشاركة ✅");
            }
        };

        // ==================== نظام التقييم الحقيقي ====================
        let activeRatingMessageId = null;
        window.openRatingModal = function(mId) {
            activeRatingMessageId = mId;
            const modal = document.getElementById('ratingModal');
            if (modal) {
                modal.classList.add('active');
                fetchRatingStats(mId);
            }
        };

        window.closeRatingModal = function() {
            const modal = document.getElementById('ratingModal');
            if (modal) modal.classList.remove('active');
        };

        window.submitRating = async function(stars) {
            if (!activeRatingMessageId) return;
            try {
                const ratingRef = db.ref(`fatwas_ratings/${activeRatingMessageId}`);
                await ratingRef.push({ stars: stars, timestamp: Date.now() });
                showNotification(`⭐ تم تسجيل تقييمك (${stars} نجوم) بنجاح!`);
                closeRatingModal();
                fetchRatingStats(activeRatingMessageId);
            } catch (e) {
                showNotification("حدث خطأ أثناء حفظ التقييم", "error");
            }
        };

        function fetchRatingStats(mId) {
            db.ref(`fatwas_ratings/${mId}`).once('value', snapshot => {
                let totalStars = 0;
                let count = 0;
                snapshot.forEach(child => {
                    totalStars += child.val().stars || 0;
                    count++;
                });
                const avg = count > 0 ? (totalStars / count).toFixed(1) : "0.0";
                const avgEl = document.getElementById('rating-average');
                const countEl = document.getElementById('rating-count');
                if (avgEl) avgEl.textContent = `التقييم: ${avg} / 5`;
                if (countEl) countEl.textContent = `(${count} تقييمات)`;
            });
        }

        // ==================== تحميل الفتاوى لقاعدة البيانات المحلية ====================
        async function loadAllFatwasForSearch() {
            try {
                const snapshot = await db.ref('fatwas_json').once('value');
                cachedFatwasMemory = [];
                snapshot.forEach(child => {
                    const val = child.val();
                    const hasAnswer = val.answer && val.answer.trim().length > 0;
                    if (hasAnswer) {
                        cachedFatwasMemory.push({
                            id: child.key,
                            question: val.question || '',
                            answer: val.answer || '',
                            category: val.category || 'عام'
                        });
                    }
                });
            } catch (e) {
                console.error("خطأ تحميل الفتاوى:", e);
            }
        }

        // ==================== Gemini API مع التناوب التلقائي الآمن ====================
        async function callGeminiAPI(userQuestion) {
            if (!dynamicApiKeys || dynamicApiKeys.length === 0) {
                return "عذراً، لا توجد مفاتيح API مفعلة حالياً في قاعدة البيانات لإتمام الرد.";
            }

            let attempts = 0;
            const maxAttempts = dynamicApiKeys.length;

            while (attempts < maxAttempts) {
                const currentObj = dynamicApiKeys[currentKeyIndex];
                const apiKey = currentObj.key;
                const fbId = currentObj.firebaseId;

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`;
                const fullPrompt = `${SYSTEM_STRICT_INSTRUCTION}\n\nالمسألة الفقهية المستفتى عنها هي: ${userQuestion}`;

                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: fullPrompt }] }],
                            generationConfig: { temperature: 0.3, maxOutputTokens: 8192 }
                        })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        const answer = data.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (answer) {
                            const newCount = (currentObj.requestsCount || 0) + 1;
                            db.ref(`api_keys/${fbId}`).update({
                                status: 'working',
                                lastUsed: new Date().toISOString(),
                                requestsCount: newCount,
                                lastError: null
                            });
                            currentKeyIndex = (currentKeyIndex + 1) % dynamicApiKeys.length;
                            return answer;
                        }
                    }

                    const statusErr = res.status;
                    let errorType = 'invalid';
                    if (statusErr === 429) errorType = 'limit';
                    else if (statusErr === 401 || statusErr === 403) errorType = 'unauthorized';

                    db.ref(`api_keys/${fbId}`).update({
                        status: errorType,
                        lastError: `HTTP Error: ${statusErr}`,
                        lastUsed: new Date().toISOString()
                    });

                } catch (err) {
                    db.ref(`api_keys/${fbId}`).update({
                        status: 'invalid',
                        lastError: err.message || 'Network Exception',
                        lastUsed: new Date().toISOString()
                    });
                }

                currentKeyIndex = (currentKeyIndex + 1) % dynamicApiKeys.length;
                attempts++;
            }

            return null;
        }

        async function saveFatwaAsJsonToDatabase(question, answerText) {
            try {
                const id = Date.now().toString();
                await db.ref(`fatwas_json/${id}`).set({
                    id: id,
                    question: question,
                    answer: answerText,
                    createdAt: new Date().toISOString(),
                    source: "model_muslim"
                });
            } catch (e) {}
        }

        // ==================== دورة السؤال مع التطابق التام 100% ====================
async function handleAsk() {
    if (!state.input.trim() || state.loading) return;

    const userText = state.input;
    state.input = "";

    const textarea = document.getElementById('message-input');
    if (textarea) {
        textarea.value = "";
        textarea.style.height = 'auto';
    }

    state.loading = true;
    state.isHeroProminent = false;
    state.autoScrollEnabled = true;

    // إضافة رسالة المستخدم
    const uMsgId = Date.now().toString();
    state.messages.push({
        role: 'user',
        text: userText,
        id: uMsgId
    });

    renderMessages();

    // الاعتماد على Gemini فقط
    let finalAnswer = await callGeminiAPI(userText);

    if (!finalAnswer) {
        finalAnswer = "عذراً، حدث خطأ في الاتصال بالنموذج. يرجى المحاولة مرة أخرى لاحقاً.";
    }

    // إضافة رسالة الذكاء الاصطناعي
    const aiMsgId = (Date.now() + 1).toString();

    state.messages.push({
        role: 'ai',
        text: '',
        verified: true,
        isTyping: true,
        id: aiMsgId
    });

    state.loading = false;
    renderMessages();

    // تأثير الكتابة
    startTypewriter(finalAnswer, aiMsgId);

    // حفظ الفتوى وإرسال الإشعار
    setTimeout(async () => {
        await saveFatwaAsJsonToDatabase(userText, finalAnswer);
        await notifyNewQuestion(userText, aiMsgId);
    }, 100);
}
        // ==================== معالجة أخطاء زر التسجيل الصوتي ====================
        function setupSpeechRecognition() {
            const micBtn = document.getElementById('mic-button');
            if (!micBtn) return;

            micBtn.addEventListener('click', () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    showNotification("متصفحك لا يدعم خاصية التعرف على الصوت", "error");
                    return;
                }

                try {
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'ar-SA';
                    recognition.interimResults = false;
                    recognition.maxAlternatives = 1;

                    recognition.onstart = () => {
                        showNotification("🎙️ جاري الاستماع, تحدث الآن...");
                    };

                    recognition.onresult = (event) => {
                        const speechText = event.results[0][0].transcript;
                        const ta = document.getElementById('message-input');
                        if (ta) {
                            ta.value = speechText;
                            state.input = speechText;
                            ta.style.height = 'auto';
                            ta.style.height = ta.scrollHeight + 'px';
                        }
                    };

                    recognition.onerror = (event) => {
                        showNotification("حدث خطأ أثناء التقاط الصوت", "error");
                    };

                    recognition.start();
                } catch (err) {
                    showNotification("تعذر تشغيل الميكروفون", "error");
                }
            });
        }

        // ==================== Event Listeners & UI Setup ====================
        function setupEventListeners() {
            const ta = document.getElementById('message-input');
            if (ta) {
                ta.addEventListener('input', (e) => {
                    state.input = e.target.value;
                    e.target.style.height = 'auto';
                    e.target.style.height = e.target.scrollHeight + 'px';
                });
                ta.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        handleAsk();
                    }
                });
            }
            const sendBtn = document.getElementById('send-button');
            if (sendBtn) sendBtn.addEventListener('click', handleAsk);

            const menuBtn = document.getElementById('menu-button');
            if (menuBtn) menuBtn.addEventListener('click', () => {
                state.isMenuOpen = !state.isMenuOpen;
                const menu = document.getElementById('dropdown-menu');
                if (menu) {
                    menu.classList.toggle('menu-hidden', !state.isMenuOpen);
                    menu.classList.toggle('menu-visible', state.isMenuOpen);
                }
            });

            setupScrollHandling();
            setupSpeechRecognition();
            loadAllFatwasForSearch();
        }
